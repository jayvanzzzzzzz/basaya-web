<!doctype html>
<html lang="fil">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4cf4">
  <title>Walang koneksyon — BaSaya</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f2ff; color: #252049; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 430px); padding: 36px; border-radius: 24px; background: white; box-shadow: 0 12px 40px #30276318; text-align: center; }
    .icon { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: #ebe8ff; color: #5b4cf4; font-size: 32px; font-weight: 800; }
    h1 { font-size: 1.5rem; line-height: 1.2; }
    p { color: #5d5875; }
    button { border: 0; border-radius: 12px; padding: 12px 24px; background: #5b4cf4; color: white; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body><main><div class="icon" aria-hidden="true">B</div><h1>Walang koneksyon sa internet</h1><p>Kailangan ng internet para gamitin ang BaSaya. Kumonekta muna at subukang muli.</p><button type="button" onclick="location.reload()">Subukan muli</button></main></body>
</html>
