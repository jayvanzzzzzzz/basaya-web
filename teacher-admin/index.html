<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teacher administration portal" />
    <title>LessonDesk — Teacher Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen"><div class="spinner"></div><p>Loading teacher portal…</p></div>

    <main id="login-view" class="auth-layout" hidden>
      <section class="auth-copy">
        <a class="brand" href="#/dashboard"><span class="brand-mark">L</span> BaSaya</a>
        <div>
          <p class="eyebrow">Teacher portal</p>
          <h1>Make every lesson count.</h1>
          <p class="lede">Build classes, prepare learning activities, and stay close to student progress.</p>
        </div>
        <p class="auth-note">Access is reserved for approved teacher accounts.</p>
      </section>
      <section class="auth-panel">
        <form id="login-form" class="form-card">
          <div><p class="eyebrow">Welcome back</p><h2>Sign in to teach</h2></div>
          <label>Email<input id="email" type="email" autocomplete="email" required placeholder="teacher@school.edu" /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password" /></label>
          <p id="login-error" class="form-error" role="alert"></p>
          <button class="button primary" type="submit">Sign in <span>→</span></button>
        </form>
      </section>
    </main>

    <div id="app-view" class="app-shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#/dashboard"><span class="brand-mark">L</span> LessonDesk</a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="#/dashboard" data-nav="dashboard"><span>◫</span> Classes</a>
          <a href="#/lessons" data-nav="lessons"><span>▤</span> Lesson library</a>
        </nav>
        <div class="sidebar-bottom"><div id="teacher-summary" class="teacher-summary"></div><button id="logout-button" class="text-button">Sign out</button></div>
      </aside>
      <section class="content"><header id="page-header" class="page-header"></header><div id="page-content"></div></section>
    </div>

    <template id="modal-template"><div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" aria-label="Close">×</button><div class="modal-content"></div></section></div></template>
    <div id="toast" class="toast" role="status"></div>

    <script type="module">
      const loading = document.getElementById("loading-screen");
      const showStartupError = (message) => {
        if (loading.hidden) return;
        loading.innerHTML = `<p style="max-width:30rem"><strong>We couldn’t start the teacher portal.</strong><br><br>${message}<br><br>Open your browser’s <strong>F12 → Console</strong> tab and send the red error message to your developer.</p>`;
      };
      setTimeout(() => showStartupError("Firebase is taking too long to respond. Check your internet connection, then reload the page."), 12000);
      import("./app.js").catch((error) => {
        console.error("Teacher portal startup failed:", error);
        showStartupError(error.message || "The Firebase SDK could not load.");
      });
    </script>
  </body>
</html>
