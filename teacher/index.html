<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teacher administration portal" />
    <title>BaSaya — Teacher Portal</title>
    <link rel="icon" type="image/png" href="../img/favicon.png?v=1" sizes="128x128" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Lexend:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme before first paint: the saved choice, else the computer's setting (js/theme.js).
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("basaya-theme"); } catch (e) {}
        if (theme !== "dark" && theme !== "light")
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Base -->
    <link rel="stylesheet" href="../css/base/tokens.css" />
    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/typography.css" />
    <link rel="stylesheet" href="../css/base/animations.css" />
    <!-- Layout -->
    <link rel="stylesheet" href="../css/layout/shell.css" />
    <link rel="stylesheet" href="../css/layout/page-header.css" />
    <!-- Components -->
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/forms.css" />
    <link rel="stylesheet" href="../css/components/cards.css" />
    <link rel="stylesheet" href="../css/components/directory.css" />
    <link rel="stylesheet" href="../css/components/menus.css" />
    <link rel="stylesheet" href="../css/components/code-stub.css" />
    <link rel="stylesheet" href="../css/components/pagination.css" />
    <link rel="stylesheet" href="../css/components/modal.css" />
    <link rel="stylesheet" href="../css/components/class-deletion.css" />
    <link rel="stylesheet" href="../css/components/toast.css" />
    <link rel="stylesheet" href="../css/components/loading.css" />
    <link rel="stylesheet" href="../css/components/theme-toggle.css" />
    <!-- Pages -->
    <link rel="stylesheet" href="../css/pages/teacher-dashboard.css" />
    <link rel="stylesheet" href="../css/pages/class-page.css" />
    <link rel="stylesheet" href="../css/pages/add-lesson.css" />
    <link rel="stylesheet" href="../css/pages/account-settings.css" />
    <link rel="stylesheet" href="../css/pages/progress.css" />
    <link rel="stylesheet" href="../css/pages/lesson-studio.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen teacher-loading" role="status" aria-live="polite">
      <div class="teacher-loading__card">
        <a class="teacher-loading__brand" href="../index.html" tabindex="-1">
          <img src="../img/logo.png" alt="" />
          <span>BaSaya</span>
        </a>
        <div class="teacher-loading__art" aria-hidden="true">
          <span class="teacher-loading__orbit teacher-loading__orbit--outer"></span>
          <span class="teacher-loading__orbit teacher-loading__orbit--inner"></span>
          <div class="teacher-loading__book">
            <svg viewBox="0 0 48 48">
              <path d="M7 11.5A4.5 4.5 0 0 1 11.5 7H41v30H11.5A4.5 4.5 0 0 0 7 41.5v-30Z" />
              <path d="M7 11.5v30M15 15h17M15 21h14M15 27h10" />
            </svg>
          </div>
          <span class="teacher-loading__spark teacher-loading__spark--one">✦</span>
          <span class="teacher-loading__spark teacher-loading__spark--two">✳</span>
          <span class="teacher-loading__orbit-dot"></span>
        </div>
        <div class="teacher-loading__message">
          <span class="teacher-loading__eyebrow">Your teaching space</span>
          <h1>Good things are<br />coming together.</h1>
          <p>Loading teacher portal…</p>
        </div>
        <div class="teacher-loading__track" aria-hidden="true"><span></span></div>
        <span class="teacher-loading__note">Getting your classroom ready</span>
      </div>
    </div>

    <div id="app-view" class="app-shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#/dashboard">
          <img src="../img/logo.png" alt="BaSaya" class="brand-logo" />
          BaSaya
        </a>
        <nav class="main-nav main-nav--admin" aria-label="Main navigation">
          <a href="#/dashboard" data-nav="classes">
            <span>◫</span>
            <span class="nav-item-text">
              <strong>Classes</strong>
              <small>View and Organize</small>
            </span>
          </a>
          <a href="#/settings" data-nav="settings">
            <span>▤</span>
            <span class="nav-item-text">
              <strong>Account settings</strong>
              <small>Manage your profile</small>
            </span>
          </a>
        </nav>

        <div id="teacher-stats" class="code-stub code-stub--sidebar">
          <span class="code-stub__label">At a glance</span>
          <span id="teacher-stats-text">—</span>
        </div>

        <div class="sidebar-bottom">
          <div class="account-menu">
            <button
              id="account-menu-toggle"
              class="account-menu__toggle"
              type="button"
              aria-label="Account options"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <span id="teacher-summary" class="teacher-summary"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <div class="account-menu__popup" hidden>
              <button id="logout-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3m9-8h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" /></svg>
                <span>Sign out</span>
              </button>
            </div>
          </div>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z" /></svg>
          </button>
        </div>
      </aside>
      <section class="content">
        <header id="page-header" class="page-header"></header>
        <div id="page-content"></div>
      </section>
    </div>

    <template id="modal-template"
      ><div class="modal-backdrop">
        <section class="modal" role="dialog" aria-modal="true">
          <button class="modal-close" aria-label="Close">×</button>
          <div class="modal-content"></div>
        </section></div
    ></template>
    <div id="toast" class="toast" role="status"></div>

    <script type="module">
      const loading = document.getElementById("loading-screen");
      const showStartupError = (message) => {
        if (loading.hidden) return;
        const paragraph = document.createElement("p");
        paragraph.style.maxWidth = "30rem";
        const heading = document.createElement("strong");
        heading.textContent = "We couldn’t start the teacher portal.";
        const consoleHint = document.createElement("strong");
        consoleHint.textContent = "F12 → Console";
        paragraph.append(
          heading,
          document.createElement("br"),
          document.createElement("br"),
          String(message),
          document.createElement("br"),
          document.createElement("br"),
          "Open your browser’s ",
          consoleHint,
          " tab and send the red error message to your developer.",
        );
        loading.replaceChildren(paragraph);
      };
      const startupTimeout = setTimeout(
        () =>
          showStartupError(
            "Firebase is taking too long to respond. Check your internet connection, then reload the page.",
          ),
        12000,
      );
      window.addEventListener("pagehide", () => clearTimeout(startupTimeout), {
        once: true,
      });
      import("./app.js").catch((error) => {
        console.error("Teacher portal startup failed:", error);
        showStartupError(error.message || "The Firebase SDK could not load.");
      });
    </script>
    <script type="module" src="../js/theme.js"></script>
  </body>
</html>
