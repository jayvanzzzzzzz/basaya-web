<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin portal" />
    <title>BaSaya — Admin Portal</title>
    <link rel="icon" type="image/png" href="../img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loader-punch"><span></span><span></span><span></span></div>
      <p>Loading admin portal…</p>
    </div>

    <div id="app-view" class="app-shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#/teachers">
          <img src="../img/logo.png" alt="BaSaya" class="brand-logo" />
          BaSaya
        </a>
        <nav class="main-nav main-nav--admin" aria-label="Main navigation">
          <a href="#/teachers" data-nav="teachers">
            <span>◫</span>
            <span class="nav-item-text">
              <strong>Teacher accounts</strong>
              <small>Manage access</small>
            </span>
          </a>
          <a href="#/classes" data-nav="classes">
            <span>▤</span>
            <span class="nav-item-text">
              <strong>All classes</strong>
              <small>Track learning</small>
            </span>
          </a>
          <a href="#/lessons" data-nav="lessons">
            <span>▧</span>
            <span class="nav-item-text">
              <strong>Lessons</strong>
              <small>Create and organize</small>
            </span>
          </a>
        </nav>
        <div class="sidebar-bottom">
          <div class="account-menu">
            <button
              id="account-menu-toggle"
              class="account-menu__toggle"
              type="button"
              aria-label="Account options"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <span id="admin-summary" class="teacher-summary"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <div class="account-menu__popup" hidden>
              <button id="logout-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3m9-8h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" /></svg>
                <span>Sign out</span>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <section class="content">
        <header id="page-header" class="page-header"></header>
        <div id="page-content"></div>
      </section>
    </div>

    <template id="modal-template"
      ><div class="modal-backdrop">
        <section class="modal" role="dialog" aria-modal="true">
          <button class="modal-close" aria-label="Close">×</button>
          <div class="modal-content"></div>
        </section></div
    ></template>
    <div id="toast" class="toast" role="status"></div>

    <script type="module">
      const loading = document.getElementById("loading-screen");
      const showStartupError = (message) => {
        if (loading.hidden) return;
        const paragraph = document.createElement("p");
        paragraph.style.maxWidth = "30rem";
        const heading = document.createElement("strong");
        heading.textContent = "We couldn’t start the admin portal.";
        const consoleHint = document.createElement("strong");
        consoleHint.textContent = "F12 → Console";
        paragraph.append(
          heading,
          document.createElement("br"),
          document.createElement("br"),
          String(message),
          document.createElement("br"),
          document.createElement("br"),
          "Open your browser’s ",
          consoleHint,
          " tab and send the red error message to your developer.",
        );
        loading.replaceChildren(paragraph);
      };
      const startupTimeout = setTimeout(
        () =>
          showStartupError(
            "Firebase is taking too long to respond. Check your internet connection, then reload the page.",
          ),
        12000,
      );
      window.addEventListener("pagehide", () => clearTimeout(startupTimeout), {
        once: true,
      });
      import("./app.js").catch((error) => {
        console.error("Admin portal startup failed:", error);
        showStartupError(error.message || "The Firebase SDK could not load.");
      });
    </script>
  </body>
</html>
